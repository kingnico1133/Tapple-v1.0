name: Build and deploy Tapple

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Tapple
        uses: actions/checkout@v4

      - name: Download the official Snap! release
        run: |
          set -euo pipefail
          mkdir -p site upstream
          curl --fail --location --retry 3 \
            https://github.com/jmoenig/Snap/archive/refs/tags/v12.3.10.zip \
            --output /tmp/snap.zip
          unzip -q /tmp/snap.zip -d upstream
          cp -a upstream/Snap-12.3.10/. site/

      - name: Apply Tapple apple branding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          apple_icon = """<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="24" fill="#fff"/><text x="64" y="68" text-anchor="middle" dominant-baseline="central" font-size="104">🍎</text></svg>"""
          Path("site/apple.svg").write_text(apple_icon, encoding="utf-8")
          public_icon = "https://kingnico1133.github.io/Tapple-v1.0/apple.svg"

          for path in Path("site").rglob("*.html"):
              html = path.read_text(encoding="utf-8")
              html = html.replace("Snap! Build your own blocks", "Tapple!")
              html = html.replace("Snap! Build Your Own Blocks", "Tapple!")
              html = html.replace('<title>Redirecting to Snap!</title>', '<title>Tapple!</title>')
              html = html.replace('<link rel="icon" href="src/favicon.ico" type="image/x-icon">', '<link rel="icon" href="apple.svg" type="image/svg+xml">')
              html = html.replace('<link rel="apple-touch-icon" href="img/snap-icon-152.png">', '<link rel="apple-touch-icon" href="apple.svg">')
              html = html.replace('<meta name="mobile-web-app-title" content="Snap!">', '<meta name="mobile-web-app-title" content="Tapple!">')
              html = html.replace('<meta name="msapplication-TileImage" content="img/snap-icon-144.png">', '<meta name="msapplication-TileImage" content="apple.svg">')
              html = html.replace('img/snap-icon-152.png', 'apple.svg')
              html = html.replace('img/snap-icon-144.png', 'apple.svg')

              meta = (
                  '\n<meta property="og:type" content="website">'
                  '\n<meta property="og:title" content="Tapple!">'
                  '\n<meta property="og:description" content="A community-hosted fallback copy of the Snap! visual programming editor.">'
                  f'\n<meta property="og:image" content="{public_icon}">'
                  '\n<meta name="twitter:card" content="summary">'
                  '\n<meta name="twitter:title" content="Tapple!">'
                  f'\n<meta name="twitter:image" content="{public_icon}">'
                  '\n'
              )
              if "<head>" in html and "property=\"og:title\"" not in html:
                  html = html.replace("<head>", "<head>" + meta, 1)
              path.write_text(html, encoding="utf-8")

          manifest_path = Path("site/manifest.json")
          if manifest_path.exists():
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              manifest["name"] = "Tapple!"
              manifest["short_name"] = "Tapple"
              manifest["icons"] = [{
                  "src": "apple.svg",
                  "sizes": "any",
                  "type": "image/svg+xml",
                  "purpose": "any maskable"
              }]
              manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Verify the editor can start
        run: |
          set -euo pipefail
          test -s site/snap.html
          test -s site/src/morphic.js
          test -s site/src/gui.js
          test -s site/src/blocks.js
          test -s site/sw.js
          test -s site/manifest.json
          echo "Snap! startup files are present."

      - name: Add Tapple fallback information
        run: |
          cat > site/tapple-info.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>About Tapple</title>
          </head>
          <body>
            <main>
              <h1>Tapple</h1>
              <p>An independent, community-hosted fallback copy of the Snap! visual programming editor.</p>
              <p>Tapple is not affiliated with or endorsed by the Snap! team or UC Berkeley.</p>
              <p><a href="snap.html">Open the programming editor</a></p>
              <p>When using this hosted copy, projects are saved locally or exported as files. Snap! cloud services may not be available.</p>
              <p>Snap! is free software licensed under the GNU Affero General Public License v3 or later. Original project: <a href="https://github.com/jmoenig/Snap">jmoenig/Snap</a>.</p>
            </main>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Build and deploy Tapple

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Tapple
        uses: actions/checkout@v4

      - name: Download the official Snap! release
        run: |
          set -euo pipefail
          mkdir -p site upstream
          curl --fail --location --retry 3 \
            https://github.com/jmoenig/Snap/archive/refs/tags/v12.3.10.zip \
            --output /tmp/snap.zip
          unzip -q /tmp/snap.zip -d upstream
          cp -a upstream/Snap-12.3.10/. site/

      - name: Apply Tapple page branding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in Path("site").rglob("*.html"):
              html = path.read_text(encoding="utf-8")
              html = html.replace("Snap! Build your own blocks", "Tapple!")
              html = re.sub(r"<title\b[^>]*>.*?</title>", "<title>Tapple!</title>", html, flags=re.I | re.S)
              html = re.sub(r'(<meta\s+(?:property|name)=["\'](?:og:title|twitter:title|application-name)["\']\s+content=)["\'][^"\']*["\']', r'\1"Tapple!"', html, flags=re.I)
              if path.name == "snap.html":
                  html = re.sub(r'<link\\s+rel=["\\']icon["\\'][^>]*>', '<link rel="icon" href="apple.svg" type="image/svg+xml">', html, flags=re.I)
                  html = re.sub(r'<link\\s+rel=["\\']apple-touch-icon["\\'][^>]*>', '<link rel="apple-touch-icon" href="apple.svg">', html, flags=re.I)
                  html = re.sub(r'<meta\\s+name=["\\']mobile-web-app-title["\\'][^>]*>', '<meta name="mobile-web-app-title" content="Tapple!">', html, flags=re.I)
              path.write_text(html, encoding="utf-8")

          manifest_path = Path("site/manifest.json")
          if manifest_path.exists():
              import json
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              manifest["name"] = "Tapple!"
              manifest["short_name"] = "Tapple"
              manifest["icons"] = [{
                  "src": "apple.svg",
                  "sizes": "any",
                  "type": "image/svg+xml",
                  "purpose": "any maskable"
              }]
              manifest_path.write_text(json.dumps(manifest, indent=2) + "\\n", encoding="utf-8")

          Path("site/apple.svg").write_text("""<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><text x="50%" y="52%" text-anchor="middle" dominant-baseline="central" font-size="108">🍎</text></svg>""", encoding="utf-8")
          PY

      - name: Verify the editor can start
        run: |
          set -euo pipefail
          test -s site/snap.html
          test -s site/src/morphic.js
          test -s site/src/gui.js
          test -s site/src/blocks.js
          test -s site/sw.js
          test -s site/manifest.json
          echo "Snap! startup files are present."

      - name: Add Tapple fallback information
        run: |
          cat > site/tapple-info.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>About Tapple</title>
          </head>
          <body>
            <main>
              <h1>Tapple</h1>
              <p>An independent, community-hosted fallback copy of the Snap! visual programming editor.</p>
              <p>Tapple is not affiliated with or endorsed by the Snap! team or UC Berkeley.</p>
              <p><a href="snap.html">Open the programming editor</a></p>
              <p>When using this hosted copy, projects are saved locally or exported as files. Snap! cloud services may not be available.</p>
              <p>Snap! is free software licensed under the GNU Affero General Public License v3 or later. Original project: <a href="https://github.com/jmoenig/Snap">jmoenig/Snap</a>.</p>
            </main>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
